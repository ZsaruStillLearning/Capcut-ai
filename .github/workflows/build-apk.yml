name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang dependensi sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Pasang Buildozer
        run: pip install --upgrade buildozer "cython==0.29.37" virtualenv

      - name: Build APK
        run: buildozer -v android debug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: CapCutCoach-APK
          path: bin/*.apk
      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: CapCutCoach-APK
          path: ${{ steps.buildozer.outputs.filename }}
